    --grade-A: #1a8917;

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);

  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 12px; }
  .me { font-size: 11px; color: var(--muted); margin-left: auto; }
  .me strong { color: var(--text); }
  .me a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 4px 10px; border-radius: 12px; background: #f0f0f3; color: var(--text);

  .chip:hover { background: #e6e6ea; }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .chip-group { display: flex; gap: 4px; align-items: center; }
  .chip-group-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  input[type="search"] { flex: 1; min-width: 200px; max-width: 360px;

  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

  .grade { display: inline-block; min-width: 22px; padding: 1px 6px;

  .grade.A { background: var(--grade-A); }
  .grade.B { background: var(--grade-B); }
  .grade.C { background: var(--grade-C); }
  .grade.R, .grade.RB { background: var(--grade-R); }
  .grade.Q { background: var(--grade-Q); }

  td.notes-col { max-width: 240px; }
  .notes-preview { color: var(--muted); font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .has-notes { color: var(--text); font-style: italic; }

  .detail-meta a { color: var(--accent); text-decoration: none; }

  .detail-row label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }

    border: 1px solid var(--border); border-radius: 4px; background: #fff; resize: vertical; }
  .last-edited { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .why { margin-top: 10px; padding: 8px 10px; border-radius: 6px;
    background: #fafaf3; border: 1px solid #f0ecd0; color: #5a4a00;
    font-size: 12px; line-height: 1.5; }
  .why strong { color: #3c3000; }
  .resume { flex: 1; min-height: 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); }
  .resume iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .resume-fallback { padding: 24px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .empty-row { padding: 40px; text-align: center; color: var(--muted); }

  /* First-time setup modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; padding: 24px; border-radius: 10px; min-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal label { display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.4px; margin: 12px 0 4px; }
  .modal input { width: 100%; padding: 8px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 6px; }
  .modal button { background: var(--accent); color: #fff; border: 0; padding: 8px 14px;
    border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 16px;
    width: 100%; }
  .modal .help { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
</style>

const CANDIDATES = window.__HIRING_DATA__.candidates;
const API_BASE   = window.__HIRING_DATA__.api_base_url;
const GENERATED  = window.__HIRING_DATA__.generated_at;
const DATA_WINDOW = window.__HIRING_DATA__.data_window;

const GRADE_ORDER = { A: 0, B: 1, C: 2, RB: 3, R: 4, Q: 5 };
const GRADE_LABELS = { A: "A", B: "B", C: "C", RB: "Rej", R: "Rej", Q: "?" };
const STATUS_OPTIONS = [
  { v: "new",          label: "New" },
  { v: "phone-screen", label: "Phone screen" },
  { v: "interview",    label: "Interview" },
  { v: "offer",        label: "Offer" },
  { v: "hired",        label: "Hired" },
  { v: "pass",         label: "Pass" },
  { v: "hold",         label: "Hold" },
];

// ===== Auth + identity =====
const PROFILE_KEY = "usaHoistHiringProfile_v2";

function getProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || "null"); }
  catch { return null; }
}
function setProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}

function showSetup(initial = true) {
  const existing = getProfile() || {};
  const html = `
    <div class="modal-bg">
      <div class="modal">
        <h2>${initial ? "Welcome — set up your hiring profile" : "Update your hiring profile"}</h2>
        <p class="help">Two values needed once. Both stay in this browser.</p>
        <label>Your name</label>
        <input id="setup-name" type="text" value="${escapeHtml(existing.name || "")}" placeholder="e.g., Robby">
        <label>Hiring API token</label>
        <input id="setup-token" type="password" value="${escapeHtml(existing.token || "")}" placeholder="paste HIRING_API_TOKEN value">
        <p class="help">Robby has the token. He pastes it once on each manager's machine. It's stored only in this browser's localStorage; never sent anywhere except our own API.</p>
        <button id="setup-save">Save and continue</button>
      </div>
    </div>
  `;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  document.getElementById("setup-name").focus();
  document.getElementById("setup-save").onclick = () => {
    const name = document.getElementById("setup-name").value.trim();
    const token = document.getElementById("setup-token").value.trim();
    if (!name || !token) { alert("Name and token are both required."); return; }
    setProfile({ name, token });
    document.querySelector(".modal-bg").remove();
    init();
  };
}

// ===== Remote state =====
const remote = { state: {}, lastSync: 0, error: null };

async function apiGet(path) {
  const profile = getProfile();
  const r = await fetch(API_BASE + path, {
    headers: { "X-Hiring-Token": profile.token, "Content-Type": "application/json" },
  });
  if (!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}
async function apiPut(path, body) {
  const profile = getProfile();
  const r = await fetch(API_BASE + path, {
    method: "PUT",
    headers: { "X-Hiring-Token": profile.token, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}

async function loadState() {
  setSyncStatus("loading…");
  try {
    const data = await apiGet("/api/candidate-state");
    remote.state = data.state || {};
    remote.lastSync = Date.now();
    remote.error = null;
    setSyncStatus("synced", "ok");
  } catch (e) {
    remote.error = e.message;
    setSyncStatus("offline · " + e.message, "bad");
  }
}

async function saveRecord(id, fields) {
  const profile = getProfile();
  const body = { application_id: id, editor: profile.name, ...fields };
  // Optimistic update
  const local = remote.state[id] || {};
  remote.state[id] = { ...local, ...fields, editor: profile.name, updated_at: new Date().toISOString() };
  setSyncStatus("saving…");
  try {
    const data = await apiPut("/api/candidate-state", body);
    remote.state[id] = data.record;
    setSyncStatus("synced", "ok");
  } catch (e) {
    setSyncStatus("save failed · " + e.message, "bad");
  }
}

function getRecord(id) {
  return remote.state[id] || { status: "new", notes: "", editor: null, updated_at: null };
}

function setSyncStatus(text, cls = "") {
  const el = document.getElementById("sync-status");
  el.textContent = text;
  el.className = "sync-status " + cls;
}

// ===== UI state =====
let filters = { role: "all", source: "all", grade: "all", status: "all", search: "" };
let sort = { col: "grade", dir: 1 };
let selectedId = null;

const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function renderChips() {
  function chips(containerSel, key, options) {
    const el = $(containerSel);
    el.innerHTML = "";
    const all = document.createElement("div");
    all.className = "chip" + (filters[key] === "all" ? " active" : "");
    all.textContent = "All";
    all.onclick = () => { filters[key] = "all"; renderChips(); renderTable(); };
    el.appendChild(all);
    options.forEach(opt => {
      const c = document.createElement("div");
      c.className = "chip" + (filters[key] === opt.v ? " active" : "");
      c.textContent = opt.label;
      c.onclick = () => { filters[key] = opt.v; renderChips(); renderTable(); };
      el.appendChild(c);
    });
  }
  chips("#role-chips", "role", [
    { v: "Operations Manager", label: "Op Mgr" },
    { v: "Revit Engineer",     label: "Revit" },
    { v: "AR Specialist",      label: "AR" },
  ]);
  chips("#source-chips", "source", [
    { v: "LinkedIn", label: "LinkedIn" },
    { v: "Indeed",   label: "Indeed" },
    { v: "Email",    label: "Email" },
    { v: "Manual",   label: "Manual" },
  ]);
  chips("#grade-chips", "grade", [
    { v: "A",  label: "A" }, { v: "B",  label: "B" },
    { v: "C",  label: "C" }, { v: "RB", label: "Rej(?)" },
    { v: "R",  label: "Rej" }, { v: "Q",  label: "?" },
  ]);
  chips("#status-chips", "status", STATUS_OPTIONS);
}

function filteredCandidates() {
  const q = filters.search.trim().toLowerCase();
  return CANDIDATES.filter(c => {
    if (filters.role   !== "all" && c.role   !== filters.role)   return false;
    if (filters.source !== "all" && c.source !== filters.source) return false;
    if (filters.grade  !== "all" && c.grade  !== filters.grade)  return false;
    if (filters.status !== "all" && getRecord(c.id).status !== filters.status) return false;
    if (q) {
      const hay = (c.full_name + " " + c.headline + " " + c.location + " " + (c.why || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const candidates = filteredCandidates().slice();
  candidates.sort((a, b) => {
    let av, bv;
    if (sort.col === "grade") { av = GRADE_ORDER[a.grade]; bv = GRADE_ORDER[b.grade]; }
    else { av = (a[sort.col] || "").toString(); bv = (b[sort.col] || "").toString(); }
    if (av < bv) return -sort.dir;
    if (av > bv) return  sort.dir;
    return 0;
  });
  const tbody = $("#rows");
  tbody.innerHTML = "";
  if (candidates.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td colspan="8" class="empty-row">No candidates match the filters.</td>';
    tbody.appendChild(tr);
  }
  candidates.forEach(c => {
    const tr = document.createElement("tr");
    tr.dataset.id = c.id;
    if (c.id === selectedId) tr.classList.add("selected");
    const rec = getRecord(c.id);
    const hasNotes = (rec.notes || "").trim().length > 0;
    tr.innerHTML = `
      <td><span class="grade ${c.grade}">${GRADE_LABELS[c.grade] || c.grade}</span></td>
      <td>${escapeHtml(roleShort(c.role))}</td>
      <td><span class="source-tag">${escapeHtml(c.source)}</span></td>
      <td>
        <div class="name">${escapeHtml(c.full_name)}</div>
        <div class="headline">${escapeHtml(c.headline)}</div>
      </td>
      <td>${escapeHtml(c.location || "")}</td>
      <td>${escapeHtml(c.application_date || "")}</td>
      <td>
        <select class="status" data-v="${rec.status || "new"}" data-id="${c.id}">
          ${STATUS_OPTIONS.map(s => `<option value="${s.v}"${rec.status === s.v ? " selected" : ""}>${s.label}</option>`).join("")}
        </select>
      </td>
      <td class="notes-col">
        <div class="notes-preview${hasNotes ? " has-notes" : ""}">
          ${hasNotes ? escapeHtml(rec.notes.slice(0, 80)) + (rec.notes.length > 80 ? "…" : "") : "—"}
        </div>
      </td>
    `;
    tr.onclick = e => {
      if (e.target.tagName === "SELECT") return;
      selectCandidate(c.id);
    };
    tr.querySelector("select.status").onchange = async e => {
      e.stopPropagation();
      const id = e.target.dataset.id;
      const v = e.target.value;
      e.target.dataset.v = v;
      await saveRecord(id, { status: v });
      if (filters.status !== "all") renderTable();
      if (selectedId === id) renderDetail(CANDIDATES.find(x => x.id === id));
    };
    tbody.appendChild(tr);
  });
  $("#stats").textContent = `${candidates.length} of ${CANDIDATES.length} candidates`;
}

function selectCandidate(id) {
  selectedId = id;
  const c = CANDIDATES.find(x => x.id === id);
  $$(".selected").forEach(el => el.classList.remove("selected"));
  const tr = $(`tr[data-id="${id}"]`);
  if (tr) tr.classList.add("selected");
  renderDetail(c);
}

function renderDetail(c) {
  const detail = $("#detail");
  if (!c) {
    detail.innerHTML = '<div class="detail-empty">Select a candidate to view their resume + take notes.</div>';
    return;
  }
  const rec = getRecord(c.id);
  const lastEdited = rec.editor && rec.updated_at
    ? `Last edited by <strong>${escapeHtml(rec.editor)}</strong> at ${formatTimestamp(rec.updated_at)}`
    : "No edits yet";
  const resumeHtml = c.cv_path
    ? `<iframe src="${encodeURI(c.cv_path)}#zoom=100" title="${escapeHtml(c.full_name)} resume"></iframe>`
    : `<div class="resume-fallback">
         <strong>No resume PDF available for this candidate.</strong><br>
         Source: <em>${escapeHtml(c.source)}</em>. Pull the resume from the source platform (Indeed dashboard, mailbox, etc.) and grade.
       </div>`;
  detail.innerHTML = `
    <div class="detail-header">
      <p class="detail-name">${escapeHtml(c.full_name)} <span class="grade ${c.grade}" style="vertical-align:middle">${GRADE_LABELS[c.grade]}</span></p>
      <p class="detail-headline">${escapeHtml(c.headline)}</p>
      <div class="detail-meta">
        <span><strong>Role:</strong> ${escapeHtml(c.role)}</span>
        <span><strong>Source:</strong> ${escapeHtml(c.source)}</span>
        <span><strong>Location:</strong> ${escapeHtml(c.location || "—")}</span>
        <span><strong>Applied:</strong> ${escapeHtml(c.application_date || "—")}</span>
        ${c.contact_email ? `<span><strong>Email:</strong> <a href="mailto:${escapeHtml(c.contact_email)}">${escapeHtml(c.contact_email)}</a></span>` : ""}
      </div>
      ${c.why ? `<div class="why">${c.why}</div>` : ""}
      <div class="detail-row">
        <label>Status</label>
        <select id="detail-status">
          ${STATUS_OPTIONS.map(s => `<option value="${s.v}"${rec.status === s.v ? " selected" : ""}>${s.label}</option>`).join("")}
        </select>
        <label style="margin-left:auto">Notes</label>
      </div>
      <div class="detail-row">
        <textarea id="detail-notes" placeholder="Phone screen notes, follow-up actions, red flags...">${escapeHtml(rec.notes || "")}</textarea>
      </div>
      <div class="last-edited">${lastEdited}</div>
    </div>
    <div class="resume">${resumeHtml}</div>
  `;
  $("#detail-status").onchange = async e => {
    await saveRecord(c.id, { status: e.target.value });
    renderTable();
    renderDetail(c);
  };
  let notesTimer;
  $("#detail-notes").oninput = e => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(async () => {
      await saveRecord(c.id, { notes: e.target.value });
      renderTable();
      // refresh just the last-edited line, leave textarea alone
      const le = detail.querySelector(".last-edited");
      const r2 = getRecord(c.id);
      if (le && r2.editor) le.innerHTML = `Last edited by <strong>${escapeHtml(r2.editor)}</strong> at ${formatTimestamp(r2.updated_at)}`;
    }, 500);
  };
}

function roleShort(role) {
  if (role === "Operations Manager") return "Op Mgr";
  if (role === "Revit Engineer")     return "Revit";
  if (role === "AR Specialist")      return "AR";
  return role;
}
function escapeHtml(s) {
  return (s || "").toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function formatTimestamp(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString();
  } catch { return iso; }
}

async function init() {
  $("#subtitle").textContent = `Window: ${DATA_WINDOW} · ${CANDIDATES.length} candidates · regenerated ${formatTimestamp(GENERATED)}`;
  const profile = getProfile();
  $("#me").innerHTML = `Logged in as <strong>${escapeHtml(profile.name)}</strong> · <a id="logout">change</a>`;
  $("#logout").onclick = () => { localStorage.removeItem(PROFILE_KEY); location.reload(); };
  $$("thead th[data-sort]").forEach(th => {
    th.onclick = () => {
      const col = th.dataset.sort;
      if (sort.col === col) sort.dir = -sort.dir;
      else { sort.col = col; sort.dir = 1; }
      renderTable();
    };
  });
  $("#search").oninput = e => { filters.search = e.target.value; renderTable(); };
  renderChips();
  await loadState();
  renderTable();
  // Periodic refresh so other managers' edits show up.
  setInterval(async () => { await loadState(); renderTable(); if (selectedId) renderDetail(CANDIDATES.find(c => c.id === selectedId)); }, 30000);
}

if (!getProfile()) {
  showSetup(true);
} else {
  init();
}
