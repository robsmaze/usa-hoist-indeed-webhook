        <p class="help">Two values needed once. Both stay in this browser.</p>
        <label>Your name</label>
        <input id="setup-name" type="text" value="${escapeHtml(existing.name || "")}" placeholder="e.g., Robby">
        <label>Hiring API token</label>
        <input id="setup-token" type="password" value="${escapeHtml(existing.token || "")}" placeholder="paste HIRING_API_TOKEN value">
        <p class="help">Robby has the token. He pastes it once on each manager's machine. It's stored only in this browser's localStorage; never sent anywhere except our own API.</p>
        <button id="setup-save">Save and continue</button>
      </div>
    </div>
  `;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  document.getElementById("setup-name").focus();
  document.getElementById("setup-save").onclick = () => {
    const name = document.getElementById("setup-name").value.trim();
    const token = document.getElementById("setup-token").value.trim();
    if (!name || !token) { alert("Name and token are both required."); return; }
    setProfile({ name, token });
    document.querySelector(".modal-bg").remove();
    init();
  };
}

// ===== Remote state =====
const remote = { state: {}, lastSync: 0, error: null };

async function apiGet(path) {
  const profile = getProfile();
  const r = await fetch(API_BASE + path, {
    headers: { "X-Hiring-Token": profile.token, "Content-Type": "application/json" },
  });
  if (!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}
async function apiPut(path, body) {
  const profile = getProfile();
  const r = await fetch(API_BASE + path, {
    method: "PUT",
    headers: { "X-Hiring-Token": profile.token, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("HTTP " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}

async function loadState() {
  setSyncStatus("loading…");
  try {
    const data = await apiGet("/api/candidate-state");
    remote.state = data.state || {};
    remote.lastSync = Date.now();
    remote.error = null;
    setSyncStatus("synced", "ok");
  } catch (e) {
    remote.error = e.message;
    setSyncStatus("offline · " + e.message, "bad");
  }
}

async function loadCandidates() {
  // Pull the live roster snapshot. Falls back silently to whatever was baked
  // into the page (window.__HIRING_DATA__) if the snapshot endpoint 404s
  // (no snapshot uploaded yet) or the network is offline.
  try {
    const data = await apiGet("/api/candidates");
    if (data && Array.isArray(data.candidates)) {
      CANDIDATES  = data.candidates;
      GENERATED   = data.generated_at || GENERATED;
      DATA_WINDOW = data.data_window  || DATA_WINDOW;
      DATA_SOURCE = "live";
    }
  } catch (e) {
    DATA_SOURCE = "static";
    if (!/HTTP 404/.test(e.message || "")) {
      console.warn("loadCandidates fell back to baked data:", e.message);
    }
  }
}

async function saveRecord(id, fields) {
  const profile = getProfile();
  const body = { application_id: id, editor: profile.name, ...fields };
  // Optimistic update
  const local = remote.state[id] || {};
  remote.state[id] = { ...local, ...fields, editor: profile.name, updated_at: new Date().toISOString() };
  setSyncStatus("saving…");
  try {
    const data = await apiPut("/api/candidate-state", body);
    remote.state[id] = data.record;
    setSyncStatus("synced", "ok");
  } catch (e) {
    setSyncStatus("save failed · " + e.message, "bad");
  }
}

function getRecord(id) {
  return remote.state[id] || { status: "new", notes: "", editor: null, updated_at: null };
}

function setSyncStatus(text, cls = "") {
  const el = document.getElementById("sync-status");
  el.textContent = text;
  el.className = "sync-status " + cls;
}

// ===== UI state =====
let filters = { role: "all", source: "all", grade: "all", status: "all", search: "" };
let sort = { col: "grade", dir: 1 };
let selectedId = null;

const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function renderChips() {
  function chips(containerSel, key, options) {
    const el = $(containerSel);
    el.innerHTML = "";
    const all = document.createElement("div");
    all.className = "chip" + (filters[key] === "all" ? " active" : "");
    all.textContent = "All";
    all.onclick = () => { filters[key] = "all"; renderChips(); renderTable(); };
    el.appendChild(all);
    options.forEach(opt => {
      const c = document.createElement("div");
      c.className = "chip" + (filters[key] === opt.v ? " active" : "");
      c.textContent = opt.label;
      c.onclick = () => { filters[key] = opt.v; renderChips(); renderTable(); };
      el.appendChild(c);
    });
  }
  chips("#role-chips", "role", [
    { v: "Operations Manager", label: "Op Mgr" },
    { v: "Revit Engineer",     label: "Revit" },
    { v: "AR Specialist",      label: "AR" },
  ]);
  chips("#source-chips", "source", [
    { v: "LinkedIn", label: "LinkedIn" },
    { v: "Indeed",   label: "Indeed" },
    { v: "Email",    label: "Email" },
    { v: "Manual",   label: "Manual" },
  ]);
  chips("#grade-chips", "grade", [
    { v: "A",  label: "A" }, { v: "B",  label: "B" },
    { v: "C",  label: "C" }, { v: "RB", label: "Rej(?)" },
    { v: "R",  label: "Rej" }, { v: "Q",  label: "?" },
  ]);
  chips("#status-chips", "status", STATUS_OPTIONS);
}

function filteredCandidates() {
  const q = filters.search.trim().toLowerCase();
  return CANDIDATES.filter(c => {
    if (filters.role   !== "all" && c.role   !== filters.role)   return false;
    if (filters.source !== "all" && c.source !== filters.source) return false;
    if (filters.grade  !== "all" && c.grade  !== filters.grade)  return false;
    if (filters.status !== "all" && getRecord(c.id).status !== filters.status) return false;
    if (q) {
      const hay = (c.full_name + " " + c.headline + " " + c.location + " " + (c.why || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const candidates = filteredCandidates().slice();
  candidates.sort((a, b) => {
    let av, bv;
    if (sort.col === "grade") { av = GRADE_ORDER[a.grade]; bv = GRADE_ORDER[b.grade]; }
    else { av = (a[sort.col] || "").toString(); bv = (b[sort.col] || "").toString(); }
    if (av < bv) return -sort.dir;
    if (av > bv) return  sort.dir;
    return 0;
  });
  const tbody = $("#rows");
  tbody.innerHTML = "";
  if (candidates.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td colspan="9" class="empty-row">No candidates match the filters.</td>';
    tbody.appendChild(tr);
  }
  candidates.forEach(c => {
    const tr = document.createElement("tr");
    tr.dataset.id = c.id;
    if (c.id === selectedId) tr.classList.add("selected");
    const rec = getRecord(c.id);
    const hasNotes = (rec.notes || "").trim().length > 0;
    tr.innerHTML = `
      <td><span class="grade ${c.grade}">${GRADE_LABELS[c.grade] || c.grade}</span></td>
      <td>${escapeHtml(roleShort(c.role))}</td>
      <td><span class="source-tag">${escapeHtml(c.source)}</span></td>
      <td>${renderIndeedSentiment(c.indeed_sentiment)}</td>
      <td>
        <div class="name">${escapeHtml(c.full_name)}</div>
        <div class="headline">${escapeHtml(c.headline)}</div>
      </td>
      <td>${escapeHtml(c.location || "")}</td>
      <td>${escapeHtml(c.application_date || "")}</td>
      <td>
        <select class="status" data-v="${rec.status || "new"}" data-id="${c.id}">
          ${STATUS_OPTIONS.map(s => `<option value="${s.v}"${rec.status === s.v ? " selected" : ""}>${s.label}</option>`).join("")}
        </select>
      </td>
      <td class="notes-col">
        <div class="notes-preview${hasNotes ? " has-notes" : ""}">
          ${hasNotes ? escapeHtml(rec.notes.slice(0, 80)) + (rec.notes.length > 80 ? "…" : "") : "—"}
        </div>
      </td>
    `;
    tr.onclick = e => {
      if (e.target.tagName === "SELECT") return;
      selectCandidate(c.id);
    };
    tr.querySelector("select.status").onchange = async e => {
      e.stopPropagation();
      const id = e.target.dataset.id;
      const v = e.target.value;
      e.target.dataset.v = v;
      await saveRecord(id, { status: v });
      if (filters.status !== "all") renderTable();
      if (selectedId === id) renderDetail(CANDIDATES.find(x => x.id === id));
    };
    tbody.appendChild(tr);
  });
  $("#stats").textContent = `${candidates.length} of ${CANDIDATES.length} candidates`;
}

function selectCandidate(id) {
  selectedId = id;
  const c = CANDIDATES.find(x => x.id === id);
  $$(".selected").forEach(el => el.classList.remove("selected"));
  const tr = $(`tr[data-id="${id}"]`);
  if (tr) tr.classList.add("selected");
  renderDetail(c);
}

// What's needed to lazy-fetch a CV via /api/cv. Returns null if the
// record has no usable lookup keys (e.g., manual records with no source).
function cvLookup(c) {
  if (!c || !c.id) return null;
  const colon = c.id.indexOf(":");
  if (colon < 0) return null;
  const applicationId = c.id.slice(colon + 1);
  const src = (c.source || "").toLowerCase();
  if (src === "linkedin") return { source: "linkedin", application_id: applicationId };
  if (src === "indeed" && c.indeed_blob_pathname) {
    return { source: "indeed", application_id: applicationId, indeed_blob_pathname: c.indeed_blob_pathname };
  }
  return null;
}

function renderResumeFromUrl(url) {
  return `<div class="resume-toolbar">
            <a class="resume-btn primary" href="${encodeURI(url)}" target="_blank" rel="noopener">↗ Open resume in new tab</a>
            <a class="resume-btn" href="${encodeURI(url)}" download>⬇ Download</a>
          </div>
          <object data="${encodeURI(url)}" type="application/pdf" class="resume-object">
            <embed src="${encodeURI(url)}" type="application/pdf">
            <div class="resume-fallback">
              Inline PDF viewer didn't load — your browser may have it disabled. Use <strong>Open resume in new tab</strong> above.
            </div>
          </object>`;
}

// Buttons for records with no resume in our system but where we know how to
// reach the source (Indeed application page, Outlook notification email).
// Rendered alongside the "no resume" fallback message.
function renderExternalLinks(c) {
  const links = [];
  if (c.indeed_application_url) {
    links.push(`<a class="resume-btn primary" href="${encodeURI(c.indeed_application_url)}" target="_blank" rel="noopener">↗ Open on Indeed</a>`);
  }
  if (c.outlook_email_uri) {
    // outlook_email_uri is the Microsoft Graph URI; the dashboard wants the
    // OWA webLink. Convert mail:///messages/<id> → outlook.office365.com OWA.
    const m = /^mail:\/\/\/messages\/([^?]+)/.exec(c.outlook_email_uri);
    if (m) {
      const owaLink = `https://outlook.office365.com/owa/?ItemID=${m[1]}&exvsurl=1&viewmodel=ReadMessageItem`;
      links.push(`<a class="resume-btn" href="${encodeURI(owaLink)}" target="_blank" rel="noopener">📧 Open notification email</a>`);
    }
  }
  if (links.length === 0) return '';
  return `<div class="resume-toolbar">${links.join('')}</div>`;
}

async function lazyLoadCV(c, container) {
  const lookup = cvLookup(c);
  if (!lookup) return;
  const profile = getProfile();
  const qs = new URLSearchParams(lookup).toString();
  try {
    const r = await fetch(API_BASE + "/api/cv?" + qs, {
      headers: { "X-Hiring-Token": profile.token },
    });
    if (!r.ok) {
      const err = await r.text();
      container.innerHTML = `<div class="resume-fallback"><strong>Couldn't load resume.</strong><br>${escapeHtml(err.slice(0, 200))}</div>`;
      return;
    }
    const data = await r.json();
    if (!data.url) {
      container.innerHTML = `<div class="resume-fallback"><strong>No resume PDF available for this candidate.</strong></div>`;
      return;
    }
    // Only swap if this candidate is still selected — otherwise we'd
    // overwrite a different candidate's detail panel.
    if (selectedId !== c.id) return;
    container.innerHTML = renderResumeFromUrl(data.url);
  } catch (e) {
    container.innerHTML = `<div class="resume-fallback"><strong>Error loading resume:</strong> ${escapeHtml(e.message || String(e))}</div>`;
  }
}

function renderDetail(c) {
  const detail = $("#detail");
  if (!c) {
    detail.innerHTML = '<div class="detail-empty">Select a candidate to view their resume + take notes.</div>';
    return;
  }
  const rec = getRecord(c.id);
  const lastEdited = rec.editor && rec.updated_at
    ? `Last edited by <strong>${escapeHtml(rec.editor)}</strong> at ${formatTimestamp(rec.updated_at)}`
    : "No edits yet";
  const lookup = cvLookup(c);
  const externalLinks = renderExternalLinks(c);
  const resumeHtml = c.cv_path
    ? renderResumeFromUrl(c.cv_path)
    : (lookup
        ? `<div class="resume-fallback" id="resume-loading">
             <strong>Loading resume…</strong><br>
             <em>Fetching from ${escapeHtml(c.source)} on demand. First open per candidate is slower (~9s for LinkedIn).</em>
           </div>`
        : `${externalLinks}
           <div class="resume-fallback">
             <strong>No resume PDF in dashboard.</strong><br>
             ${c.indeed_application_url || c.outlook_email_uri
               ? "Use the buttons above to open the source — Indeed locks resumes behind their UI for now."
               : `Source: <em>${escapeHtml(c.source)}</em>. Pull the resume from the source platform and grade.`}
           </div>`);
  detail.innerHTML = `
    <div class="detail-header">
      <p class="detail-name">${escapeHtml(c.full_name)} <span class="grade ${c.grade}" style="vertical-align:middle">${GRADE_LABELS[c.grade]}</span></p>
      <p class="detail-headline">${escapeHtml(c.headline)}</p>
      <div class="detail-meta">
        <span><strong>Role:</strong> ${escapeHtml(c.role)}</span>
        <span><strong>Source:</strong> ${escapeHtml(c.source)}</span>
        <span><strong>Location:</strong> ${escapeHtml(c.location || "—")}</span>
        <span><strong>Applied:</strong> ${escapeHtml(c.application_date || "—")}</span>
        ${c.contact_email ? `<span><strong>Email:</strong> <a href="mailto:${escapeHtml(c.contact_email)}">${escapeHtml(c.contact_email)}</a></span>` : ""}
      </div>
      ${c.why ? `<div class="why">${c.why}</div>` : ""}
      <div class="detail-row">
        <label>Status</label>
        <select id="detail-status">
          ${STATUS_OPTIONS.map(s => `<option value="${s.v}"${rec.status === s.v ? " selected" : ""}>${s.label}</option>`).join("")}
        </select>
        <label style="margin-left:auto">Notes</label>
      </div>
      <div class="detail-row">
        <textarea id="detail-notes" placeholder="Phone screen notes, follow-up actions, red flags...">${escapeHtml(rec.notes || "")}</textarea>
      </div>
      <div class="last-edited">${lastEdited}</div>
    </div>
    <div class="resume">${resumeHtml}</div>
  `;
  // Kick off lazy CV fetch when we rendered a placeholder rather than a
  // ready-to-show iframe. The replace happens in-place inside .resume so
  // the detail panel layout doesn't shift.
  if (!c.cv_path && lookup) {
    lazyLoadCV(c, detail.querySelector(".resume"));
  }

  $("#detail-status").onchange = async e => {
    await saveRecord(c.id, { status: e.target.value });
    renderTable();
    renderDetail(c);
  };
  let notesTimer;
  $("#detail-notes").oninput = e => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(async () => {
      await saveRecord(c.id, { notes: e.target.value });
      renderTable();
      // refresh just the last-edited line, leave textarea alone
      const le = detail.querySelector(".last-edited");
      const r2 = getRecord(c.id);
      if (le && r2.editor) le.innerHTML = `Last edited by <strong>${escapeHtml(r2.editor)}</strong> at ${formatTimestamp(r2.updated_at)}`;
    }, 500);
  };
}

// Render Indeed Employer's per-candidate rating as a small colored badge.
// Map: YES → Shortlist (green), MAYBE → Undecided (yellow), NO → Reject
// (red), UNSET / missing → an em-dash. Empty for non-Indeed records.
const INDEED_RATING_LABELS = { YES: "Shortlist", MAYBE: "Undecided", NO: "Reject" };
function renderIndeedSentiment(s) {
  if (!s) return "";
  if (s in INDEED_RATING_LABELS) {
    return `<span class="indeed-rating ${s}">${INDEED_RATING_LABELS[s]}</span>`;
  }
  return `<span class="indeed-rating UNSET">—</span>`;
}

function roleShort(role) {
  if (role === "Operations Manager") return "Op Mgr";
  if (role === "Revit Engineer")     return "Revit";
  if (role === "AR Specialist")      return "AR";
  return role;
}
function escapeHtml(s) {
  return (s || "").toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function formatTimestamp(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString();
  } catch { return iso; }
}

function updateSubtitle() {
  const sourceLabel = DATA_SOURCE === "live" ? "Live" : "Static";
  $("#subtitle").textContent =
    `${sourceLabel} · ${CANDIDATES.length} candidates · ${DATA_WINDOW || "no window"} · updated ${formatTimestamp(GENERATED)}`;
}

async function init() {
  const profile = getProfile();
  $("#me").innerHTML = `Logged in as <strong>${escapeHtml(profile.name)}</strong> · <a id="logout">change</a>`;
  $("#logout").onclick = () => { localStorage.removeItem(PROFILE_KEY); location.reload(); };
  $$("thead th[data-sort]").forEach(th => {
    th.onclick = () => {
      const col = th.dataset.sort;
      if (sort.col === col) sort.dir = -sort.dir;
      else { sort.col = col; sort.dir = 1; }
      renderTable();
    };
  });
  $("#search").oninput = e => { filters.search = e.target.value; renderTable(); };
  renderChips();
  await Promise.all([loadCandidates(), loadState()]);
  updateSubtitle();
  renderTable();
  // Periodic refresh so other managers' edits show up AND new applicants
  // appear without a page reload.
  setInterval(async () => {
    await Promise.all([loadCandidates(), loadState()]);
    updateSubtitle();
    renderTable();
    if (selectedId) {
      const sel = CANDIDATES.find(c => c.id === selectedId);
      if (sel) renderDetail(sel);
    }
  }, 30000);
}

if (!getProfile()) {
  showSetup(true);
} else {
  init();
}
</script>
